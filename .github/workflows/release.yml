name: Release

on:
  push:
    tags:
      - "v*"

# 既定では何も書けないようにし、ジョブで必要な分だけ付ける
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # 鍵は Environment "release" の secret に置く (保護ルールで v* タグ・承認者を絞る)
    environment: release
    permissions:
      contents: write      # GitHub Release の作成
      id-token: write      # attestation の署名 (Sigstore の OIDC)
      attestations: write  # attestation の保存
    steps:
      # アクションはタグではなくコミット SHA で固定する (タグは付け替えられる)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches versionName
        run: |
          version_name=$(sed -nE 's/^\s*versionName = "(.*)"/\1/p' app/build.gradle.kts)
          if [ "v${version_name}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match versionName ${version_name}"
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # リリースのビルドはキャッシュを使わない (他のワークフローが書いたキャッシュの汚染を避ける)。
      # Gradle Wrapper の検証は setup-gradle が行う
      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
        with:
          cache-disabled: true

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          QUASAR_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          QUASAR_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          QUASAR_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          QUASAR_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # 署名が想定した証明書かを確かめる (RELEASE_CERT_SHA256 は公開してよい値なので Variables に置く)
      - name: Verify signature
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          # 出力の形は build-tools の版で変わる (36 まで "Signer #1 certificate ...", 37 は "V2 Signer: certificate ...")
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          actual=$(echo "$certs" | sed -nE 's/^.*certificate SHA-256 digest: //p' | sort -u)
          expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::signing certificate mismatch (got ${actual})"
            exit 1
          fi

      - name: Prepare assets
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/quasar-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/quasar-${GITHUB_REF_NAME}-mapping.txt"
          cd dist && sha256sum * > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/quasar-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

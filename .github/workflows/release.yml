name: Release

on:
  push:
    tags:
      - "v*"

# 既定では何も書けないようにし、ジョブで必要な分だけ付ける
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 署名付きの APK を作って確かめる (build.yml。鍵はこの中の Environment "release" から読む)
  build:
    uses: ./.github/workflows/build.yml
    with:
      release: true
    # 再利用ワークフローには secret が自動では渡らない。必要な分だけ 1 つずつ渡す
    secrets:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    permissions:
      contents: read

  # attestation を付けて GitHub Release を作る。鍵には触れない
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # GitHub Release の作成
      id-token: write      # attestation の署名 (Sigstore の OIDC)
      attestations: write  # attestation の保存
    steps:
      # アクションはタグではなくコミット SHA で固定する (タグは付け替えられる)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apks
          path: dist

      - name: Check checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/quasar-${{ github.ref_name }}-*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag

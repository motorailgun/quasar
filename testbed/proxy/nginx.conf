worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker の内蔵 DNS。起動時に上流が無くても落ちないよう、変数で毎回引く
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $host $server_name_short {
    alpha.quasar.test  alpha;
    stable.quasar.test stable;
    legacy.quasar.test legacy;
  }
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name alpha.quasar.test stable.quasar.test legacy.quasar.test;

    ssl_certificate     /testbed/state/certs/server.crt;
    ssl_certificate_key /testbed/state/certs/server.key;

    client_max_body_size 200m;

    # proxy_set_header は location で 1 つでも書くと上の階層の分が全部消えるので、各 location に書く
    proxy_http_version 1.1;

    if ($server_name_short = "") { return 421; }

    location /api/v1/streaming {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 1h;
      proxy_pass http://$server_name_short-streaming:4000;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_read_timeout 120s;
      proxy_pass http://$server_name_short-web:3000;
    }
  }
}
